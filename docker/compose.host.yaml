name: ofm
services:
  ofm:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OFM_SOURCE_REPO: "${OFM_SOURCE_REPO:-https://github.com/Ebony-Vinyl/dsh-our-free-model.git}"
        OFM_SOURCE_REF: "${OFM_SOURCE_REF:-v2.7.2}"
    image: ofm-standalone:2.7.2
    container_name: ofm
    # Linux host networking is the recommended full mode:
    # - management stays on 127.0.0.1:18900 (SSH tunnel from your laptop)
    # - LAN API is on 0.0.0.0:18901 with its own key
    # - OAuth callbacks that target 127.0.0.1 reach the container only when the
    #   browser runs on this same host; see README for the remote-browser caveat.
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    environment:
      OFM_HOME: /data
      HOME: /data/home
      OFM_PORT: "18900"
      OFM_LAN: "1"
      OFM_LAN_PORT: "18901"
      OFM_REFRESH: "1"
      OFM_CLEAR_STALE_LOCK: "1"
      TZ: "${TZ:-Asia/Shanghai}"
      # Keep V8 memory flags out of process.execArgv (Worker rejects some).
      NODE_OPTIONS: "--max-old-space-size=1536"
    volumes:
      - ofm-data:/data
      # Optional: mount native subscription credentials read-only.
      # The service reads them from HOME (/data/home), not from arbitrary paths.
      # - ${HOME}/.codex:/data/home/.codex:ro
      # - ${HOME}/.claude:/data/home/.claude:ro
      # - ${HOME}/.gemini:/data/home/.gemini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18900/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ofm-data:
    name: ofm-data
